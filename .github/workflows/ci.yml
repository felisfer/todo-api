name: CI

on:
  push:
    branches: [main]
  pull_request:

# Permisos mínimos por defecto; cada job pide solo lo que necesita.
permissions:
  contents: read

# Si llega un push nuevo al mismo PR, cancela la ejecución anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint y pruebas (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test

  build:
    name: Construir, escanear y publicar imagen
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write          # publicar en GHCR
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Genera tags en minúsculas: sha-completo y "latest" (solo en main)
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      # 1) Construir la imagen y cargarla localmente para escanearla
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: todo-api:scan
          build-args: APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 2) Escaneo de vulnerabilidades: falla si hay CRITICAL o HIGH con parche disponible
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: todo-api:scan
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      # 3) Publicar solo desde main (en PRs solo se construye y escanea)
      - if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=${{ github.sha }}
          cache-from: type=gha
