# Dependabot abre PRs semanales para actualizar dependencias (DevSecOps).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: terraform
    directories: ["/infra/bootstrap", "/infra/app"]
    schedule:
      interval: weekly
